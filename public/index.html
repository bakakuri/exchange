<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Exchange</title>
  <meta name="description" content="Complete tasks for other creators to earn credits, then spend credits to grow your own pages." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light dark" />
  <!-- Sets data-theme before first paint (must stay above the stylesheets). -->
  <script src="/js/core/theme-init.js"></script>
  <link rel="preload" href="/fonts/FiraGO-Regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/profile.css" />
  <link rel="stylesheet" href="/css/credits.css" />
  <link rel="stylesheet" href="/css/tasks.css" />
  <link rel="stylesheet" href="/css/verification.css" />
  <link rel="stylesheet" href="/css/campaigns.css" />
  <link rel="stylesheet" href="/css/notifications.css" />
  <link rel="stylesheet" href="/css/achievements.css" />
  <link rel="stylesheet" href="/css/referrals.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <link rel="stylesheet" href="/css/reports.css" />
  <link rel="stylesheet" href="/css/home.css" />
</head>
<body>
  <header class="app-header">
    <a class="app-header__brand" href="/" data-link aria-label="Exchange home">
      <svg class="app-header__mark" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8.5h14.5M15 5l3.5 3.5L15 12" />
        <path d="M20 15.5H5.5M9 12l-3.5 3.5L9 19" />
      </svg>
      <span>Exchange</span>
    </a>
    <!-- Wide screens: account items sit in row one, page links form a tab
         row underneath. Small screens: this wrapper is the drop-down panel. -->
    <div class="app-menu" id="main-menu">
      <nav class="app-nav" id="main-nav" aria-label="Main navigation">
        <a href="/" data-link>Home</a>
        <a href="/tasks" data-link>Tasks</a>
        <a href="/campaigns" data-link>Campaigns</a>
        <a href="/submissions" data-link>Submissions</a>
        <a href="/submissions/review" data-link>To review</a>
        <a href="/notifications" data-link>Notifications</a>
        <a href="/achievements" data-link>Achievements</a>
        <a href="/referrals" data-link>Referrals</a>
        <a href="/reports" data-link>Reports</a>
      </nav>
      <div class="app-nav__auth" id="auth-nav"></div>
    </div>
    <div class="app-header__actions">
      <button class="icon-button app-theme-toggle" id="theme-toggle" type="button" aria-label="Switch theme">
        <!-- Shows the current theme: sun in light, moon in dark. -->
        <svg class="app-theme-toggle__sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4" />
        </svg>
        <svg class="app-theme-toggle__moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
        </svg>
      </button>
      <button class="icon-button app-menu-toggle" id="menu-toggle" type="button"
              aria-controls="main-menu" aria-expanded="false" aria-label="Open menu">
        <span class="app-menu-toggle__bars" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main id="app-root" class="app-main" aria-live="polite">
    <!-- router.js injects page content here -->
  </main>

  <footer class="app-footer">
    <p>&copy; 2026 Exchange</p>
  </footer>

  <script type="module" src="/js/core/app.js"></script>
</body>
</html>
