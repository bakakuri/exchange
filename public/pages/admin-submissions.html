<section class="admin-page admin-submissions-page">
  <h1>Admin</h1>
  <nav class="admin-tabs" data-admin-tabs aria-label="Admin sections"></nav>

  <div class="admin-toolbar">
    <label class="search-box">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search" /></svg>
      <input type="search" placeholder="Campaign, member or account" aria-label="Search submissions" data-admin-search maxlength="60" autocomplete="off" />
    </label>
    <label class="admin-toolbar__filter">
      <span>Status</span>
      <select class="form-input" data-admin-status>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
        <option value="expired">Expired</option>
        <option value="reversed">Reversed</option>
        <option value="">All</option>
      </select>
    </label>
  </div>

  <ul class="admin-list" data-admin-list></ul>
  <p class="form-error" data-admin-error role="alert" hidden></p>
  <button class="btn btn--ghost btn--sm" data-admin-more type="button" hidden>Load more</button>
</section>
