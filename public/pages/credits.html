<section class="credits-page">
  <h1>Credits</h1>
  <p class="page-intro">Everything you have earned and spent, newest first.</p>

  <div class="panel credits-hero">
    <div>
      <span class="panel__label"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-coins" /></svg>Balance</span>
      <p class="credits-balance" data-credits-balance>&nbsp;</p>
    </div>
    <div class="credits-hero__actions">
      <a class="btn btn--primary" href="/tasks" data-link>Earn credits</a>
      <a class="btn" href="/campaigns/new" data-link>Spend on a campaign</a>
    </div>
  </div>

  <div class="panel welcome-bonus" data-welcome-bonus hidden></div>

  <h2>Summary</h2>
  <dl class="credits-summary" data-credits-summary></dl>

  <h2>Transaction history</h2>
  <ul class="ledger-list" data-ledger-list></ul>
  <button type="button" class="btn btn--ghost" id="load-more-btn" hidden>Load more</button>
  <p class="form-error" id="ledger-error" role="alert" hidden></p>
</section>
