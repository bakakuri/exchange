<section class="admin-page admin-campaigns-page">
  <h1>Admin</h1>
  <nav class="admin-tabs" data-admin-tabs aria-label="Admin sections"></nav>

  <div class="admin-toolbar">
    <label class="search-box">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search" /></svg>
      <input type="search" placeholder="Search by title" aria-label="Search campaigns" data-admin-search maxlength="60" autocomplete="off" />
    </label>
    <label class="admin-toolbar__filter">
      <span>Status</span>
      <select class="form-input" data-admin-status>
        <option value="">All</option>
        <option value="active">Active</option>
        <option value="paused">Paused</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </label>
  </div>

  <ul class="admin-list" data-admin-list></ul>
  <p class="form-error" data-admin-error role="alert" hidden></p>
  <button class="btn btn--ghost btn--sm" data-admin-more type="button" hidden>Load more</button>
</section>
