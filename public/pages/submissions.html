<section class="submissions-page">
  <h1>My submissions</h1>
  <p class="page-intro">Tasks you have completed, and where each one stands.</p>

  <div class="submissions-filter">
    <div class="field">
      <label for="filter-status">Status</label>
      <select id="filter-status">
        <option value="">All</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>
  </div>

  <ul class="submission-list" data-submission-list></ul>
  <button type="button" class="btn btn--ghost" id="submissions-load-more" hidden>Load more</button>
  <p class="form-error" id="submissions-error" role="alert" hidden></p>
</section>
