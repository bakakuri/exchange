<section class="auth-page">
  <div class="auth-card">
    <span class="brand__mark auth-card__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h14.5M15 5l3.5 3.5L15 12" /><path d="M20 15.5H5.5M9 12l-3.5 3.5L9 19" /></svg>
    </span>
    <h1>Reset your password</h1>
    <p class="auth-card__sub">Enter your email and we'll send you a link to set a new password.</p>

    <div data-reset-request>
      <form id="reset-request-form" class="form" novalidate>
        <div class="field">
          <label for="reset-email">Email</label>
          <input id="reset-email" name="email" type="email" autocomplete="email" required />
        </div>
        <p class="form-error" id="reset-request-error" role="alert" hidden></p>
        <p class="form-success" id="reset-request-success" role="status" hidden>
          If that email is registered, a reset link has been sent.
        </p>
        <button type="submit" class="btn btn--primary">Send reset link</button>
      </form>
  </div>

  <div data-reset-confirm hidden>
    <form id="reset-confirm-form" class="form" novalidate>
      <div class="field">
        <label for="reset-new-password">New password</label>
        <input id="reset-new-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <p class="form-error" id="reset-confirm-error" role="alert" hidden></p>
      <button type="submit" class="btn btn--primary">Set new password</button>
    </form>
  </div>

  </div>

  <p class="auth-page__alt"><a href="/login" data-link>Back to sign in</a></p>
</section>
