<section class="auth-page">
  <div class="auth-card">
    <span class="brand__mark auth-card__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h14.5M15 5l3.5 3.5L15 12" /><path d="M20 15.5H5.5M9 12l-3.5 3.5L9 19" /></svg>
    </span>
    <h1>Sign in</h1>
    <p class="auth-card__sub">Welcome back. Your tasks and credits are where you left them.</p>
    <form id="login-form" class="form" novalidate>
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button type="submit" class="btn btn--primary">Sign in</button>
    </form>
  </div>

  <p class="auth-page__alt">No account? <a href="/register" data-link>Create one</a></p>
  <p class="auth-page__alt"><a href="/password-reset" data-link>Forgot your password?</a></p>
</section>
