<section class="campaign-new-page">
  <h1>New campaign</h1>
  <p class="campaign-new__intro" data-balance-hint></p>

  <form id="campaign-form" class="form campaign-form" novalidate>
    <fieldset class="form-step">
      <legend class="form-step__title"><span class="form-step__num" aria-hidden="true">1</span>What and where</legend>
      <div class="field">
        <label for="campaign-task-type">What should members do?</label>
        <select id="campaign-task-type" name="task_type" required></select>
      </div>
      <div class="field">
        <span class="field__label" id="campaign-target-label">Where?</span>
        <div data-target-picker></div>
      </div>
    </fieldset>

    <fieldset class="form-step">
      <legend class="form-step__title"><span class="form-step__num" aria-hidden="true">2</span>About the campaign</legend>
      <div class="field">
        <label for="campaign-title">Title</label>
        <input id="campaign-title" name="title" type="text" maxlength="120" required />
      </div>
      <div class="field">
        <label for="campaign-description">Description</label>
        <textarea id="campaign-description" name="description" maxlength="2000" rows="3"></textarea>
      </div>
      <div class="field">
        <label for="campaign-instructions">Instructions</label>
        <textarea id="campaign-instructions" name="instructions" maxlength="1000" rows="3"></textarea>
      </div>
    </fieldset>

    <fieldset class="form-step">
      <legend class="form-step__title"><span class="form-step__num" aria-hidden="true">3</span>Checking and budget</legend>
      <div class="field">
        <label for="campaign-verification-method">Verification method</label>
        <select id="campaign-verification-method" name="verification_method" aria-describedby="campaign-verification-hint">
          <option value="manual_proof">Manual proof review</option>
          <option value="link_click">Link click</option>
        </select>
        <p class="form-hint" id="campaign-verification-hint" data-verification-hint></p>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="campaign-reward">Reward per completion (credits)</label>
          <input id="campaign-reward" name="reward" type="number" min="1" step="1" inputmode="numeric" required />
        </div>
        <div class="field">
          <label for="campaign-desired-completions">Desired completions</label>
          <input id="campaign-desired-completions" name="desired_completions" type="number" min="1" step="1" inputmode="numeric" required />
        </div>
      </div>
      <p class="campaign-new__total" data-campaign-total></p>
    </fieldset>

    <p class="form-error" id="campaign-error" role="alert" hidden></p>
    <button type="submit" class="btn btn--primary">Create campaign</button>
  </form>
</section>
